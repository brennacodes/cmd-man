[package]
name = "cmd-man"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
birdcage = "0.8.1"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
keyring = "4.1.6"
libc = "0.2.189"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
toml = "1.1.4"
ureq = { version = "3.3.0", features = ["json"] }
wait-timeout = "0.2.1"
which = "8.0.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
