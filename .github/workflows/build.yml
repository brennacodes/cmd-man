name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            native: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
            native: false
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            native: true
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            native: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: target/${{ matrix.target }}/release/cmd-man --version
      - name: Archive
        run: tar -czf cmd-man-${{ matrix.platform }}.tar.gz -C target/${{ matrix.target }}/release cmd-man
      - uses: actions/upload-artifact@v4
        with:
          name: cmd-man-${{ matrix.platform }}
          path: cmd-man-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7
